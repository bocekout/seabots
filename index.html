<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>v1</title>
  <style>
    #photos {
      display: flex;
      width: 100%;
      column-gap: 6px;
      row-gap: 6px;
      flex-wrap: wrap;
    }

    .photo-container {
      position: relative;
    }

    .photo-container canvas {
      opacity: 60%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .photo-container button {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      color: white;
    }

    button.scan {
      right: 16px;
    }

    .scan:before {
      content: '🔍';
    }

    .close::before {
      content: "\2715"
    }
  </style>
</head>

<body>
  <div id="video-container">
    <video id="video" width="720" height="560" autoplay muted></video>
    <canvas id="output" width="720" height="560" style="position: absolute; top: 0; left: 0;"></canvas>
  </div>
  <div>
    <button id="capture">Click!</button>
  </div>
  <div id="photos"></div>
  <!-- <script type="module" src="./src/camera.js"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script type="module" src="./src/segmenter.js"></script>
</body>

</html>
